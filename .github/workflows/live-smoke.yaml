name: Live provider smoke test

on:
  workflow_call:
    inputs:
      provider:
        default: all
        type: string
      capability:
        default: all
        type: string
      options-json:
        default: "{}"
        type: string
      include-research:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      provider:
        description: Provider ID, or all configured providers
        default: all
        type: string
      capability:
        description: Capability to test, or all supported capabilities
        required: true
        default: all
        type: choice
        options: [all, search, contents, answer, research]
      options-json:
        description: Provider-specific request options as JSON (not credentials)
        default: "{}"
        type: string
      include-research:
        description: Allow a potentially billable research job
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Live provider tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install and build
        run: npm ci
      - name: Test the selected provider and capability
        env:
          PROVIDER: ${{ inputs.provider }}
          CAPABILITY: ${{ inputs.capability }}
          PROVIDER_OPTIONS: ${{ inputs.options-json }}
          INCLUDE_RESEARCH: ${{ inputs.include-research }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BRAVE_ANSWERS_API_KEY: ${{ secrets.BRAVE_ANSWERS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          VALYU_API_KEY: ${{ secrets.VALYU_API_KEY }}
        run: |
          args=(--provider "$PROVIDER" --capability "$CAPABILITY" --options-json "$PROVIDER_OPTIONS")
          if [[ "$INCLUDE_RESEARCH" == "true" ]]; then
            args+=(--include-research)
          fi
          node scripts/live-smoke.mjs "${args[@]}"
